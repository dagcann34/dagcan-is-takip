<!doctype html>
<!--
  LinkedIn belge (PDF) karuseli: 8 slayt, 1080×1350 (4:5). Kullanım: ?lang=tr|en
  PDF: marketing/render.sh (Chrome --print-to-pdf)
-->
<html>
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../../node_modules/@fontsource-variable/inter/index.css" />
<link rel="stylesheet" href="../../node_modules/@fontsource/rajdhani/700.css" />
<link rel="stylesheet" href="../../node_modules/@fontsource-variable/jetbrains-mono/index.css" />
<style>
  @page { size: 1080px 1350px; margin: 0; }
  :root { --bg: #06070E; --cyan: #00F0FF; --magenta: #FF2E88; --volt: #FCEE0A; --green: #3CFFA0; --ink: #E8F7FF; --muted: #A7B6D6; --line: rgb(0 240 255 / .22); }
  * { box-sizing: border-box; margin: 0; }
  html, body { background: var(--bg); }
  body { font-family: "Inter Variable", system-ui, sans-serif; color: var(--ink); -webkit-font-smoothing: antialiased; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .slide {
    width: 1080px; height: 1350px; position: relative; overflow: hidden; page-break-after: always; break-after: page;
    padding: 96px 84px 120px;
    background:
      radial-gradient(800px 600px at 0% 0%, rgb(224 33 138 / .28), transparent 62%),
      radial-gradient(800px 700px at 100% 100%, rgb(0 240 255 / .18), transparent 60%),
      linear-gradient(rgb(0 240 255 / .05) 1px, transparent 1px) 0 0 / 40px 40px,
      linear-gradient(90deg, rgb(0 240 255 / .05) 1px, transparent 1px) 0 0 / 40px 40px,
      var(--bg);
    display: flex; flex-direction: column;
  }
  .slide::after { content: ''; position: absolute; inset: 0; pointer-events: none; background: repeating-linear-gradient(180deg, rgb(255 255 255 / .025) 0 1px, transparent 1px 3px); }
  .top { display: flex; align-items: center; gap: 14px; font-family: "JetBrains Mono Variable", monospace; font-size: 22px; letter-spacing: .1em; color: var(--muted); text-transform: uppercase; }
  .top img { width: 46px; height: 46px; }
  .top b { font-family: Rajdhani, sans-serif; font-size: 34px; color: var(--ink); letter-spacing: .14em; }
  .kicker { margin-top: 64px; font-family: "JetBrains Mono Variable", monospace; font-size: 24px; color: var(--magenta); letter-spacing: .12em; text-transform: uppercase; }
  h1, h2 { font-family: Rajdhani, sans-serif; font-weight: 700; text-transform: uppercase; letter-spacing: .02em; line-height: .95; }
  h1 { font-size: 150px; margin-top: 18px; }
  h2 { font-size: 86px; margin-top: 16px; }
  em { font-style: normal; color: var(--cyan); text-shadow: 0 0 30px rgb(0 240 255 / .5); }
  .lead { margin-top: 28px; font-size: 36px; line-height: 1.35; color: var(--muted); }
  ul { list-style: none; padding: 0; margin-top: 40px; display: grid; gap: 22px; }
  li { display: flex; gap: 18px; font-size: 32px; line-height: 1.3; }
  li i { flex: none; width: 40px; height: 40px; display: grid; place-items: center; font-style: normal; font-size: 20px; color: var(--cyan); border: 1.5px solid rgb(0 240 255 / .5); background: rgb(0 240 255 / .08); }
  .shot { margin-top: auto; border: 1.5px solid rgb(0 240 255 / .55); box-shadow: 0 0 50px rgb(0 240 255 / .22), 0 30px 80px rgb(0 0 0 / .6); overflow: hidden; }
  .shot img { display: block; width: 100%; }
  .grid4 { margin-top: auto; display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
  .grid4 figure { border: 1.5px solid var(--line); overflow: hidden; }
  .grid4 img { display: block; width: 100%; aspect-ratio: 16 / 10; object-fit: cover; object-position: right top; }
  .grid4 figcaption { padding: 10px 14px; font-family: Rajdhani, sans-serif; font-size: 26px; letter-spacing: .08em; text-transform: uppercase; background: rgb(15 18 38 / .9); }
  .pills { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 44px; }
  .pill { padding: 12px 22px; font-family: Rajdhani, sans-serif; font-size: 28px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; border: 1.5px solid var(--line); clip-path: polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px); }
  .pill.volt { background: var(--volt); color: var(--bg); border-color: var(--volt); }
  .cta { margin-top: auto; padding: 36px 40px; border: 2px solid var(--volt); background: rgb(252 238 10 / .07); }
  .cta .url { font-family: "JetBrains Mono Variable", monospace; font-size: 34px; color: var(--volt); }
  .cta p { margin-top: 12px; font-size: 28px; color: var(--muted); }
  .foot { position: absolute; left: 84px; right: 84px; bottom: 52px; display: flex; justify-content: space-between; align-items: center; font-size: 20px; color: var(--muted); }
  .foot .n { font-family: "JetBrains Mono Variable", monospace; color: var(--cyan); }
  .bigicon { width: 300px; height: 300px; margin-top: 60px; filter: drop-shadow(0 0 40px rgb(0 240 255 / .5)); }
  .swipe { position: absolute; right: 84px; bottom: 120px; font-family: Rajdhani, sans-serif; font-size: 30px; letter-spacing: .14em; color: var(--magenta); text-transform: uppercase; }
</style>
</head>
<body>
<div id="deck"></div>
<script>
(() => {
  const lang = new URLSearchParams(location.search).get('lang') === 'en' ? 'en' : 'tr';
  document.documentElement.lang = lang;
  const S = (n) => `../../docs/screenshots/${n}-${lang}.png`;
  const C = {
    tr: {
      credit: 'Dağcan Nural tarafından geliştirilmiştir',
      swipe: 'Kaydır →',
      slides: [
        { type: 'cover', kicker: 'Ücretsiz · Açık kaynak', title: 'Kan<em>vault</em>', lead: 'BT ekipleri için iş panosu, şifreli kasa, zaman makinesi ve dashboard stüdyosu — tek bir masaüstü uygulamasında.', pills: ['Ücretsiz & açık kaynak', 'Windows', 'macOS', 'TR / EN'] },
        { type: 'list', kicker: 'Sorun', title: 'Bir sistem yöneticisi, <em>beş ayrı araç</em>', items: [['▦', 'Görevler bir yerde, sunucu şifreleri başka yerde'], ['⌁', 'PowerShell betikleri masaüstünde dağınık'], ['✉', 'Haftalık rapor e-postası hep son dakikaya kalıyor'], ['?', '“Geçen ay ne yaptık?” sorusunun cevabı yok']] },
        { type: 'shot', kicker: 'Pano', title: 'Ekrana tam oturan <em>neon Kanban</em>', lead: 'Kazara sürükleme yok. Öncelik, son tarih, bağımlılık, kontrol listesi, süre takibi, tekrarlayan görevler ve hazır şablonlar.', img: 'board' },
        { type: 'shot', kicker: 'Zaman Makinesi', title: 'Herhangi bir <em>güne dön</em>', lead: 'Her değişiklik şifreli olarak kaydedilir. Panonun o günkü hâlini ve o gün yapılan her işi gör.', img: 'history' },
        { type: 'themes', kicker: 'Dashboard Stüdyosu', title: 'Tarih aralığı seç, <em>tema seç</em>', lead: 'Tek tıkla PNG / PDF rapor.', imgs: [['dash-neon', 'Neon HUD'], ['dash-whiteboard', 'Beyaz Tahta'], ['dash-chalkboard', 'Kara Tahta'], ['dash-blueprint', 'Blueprint']] },
        { type: 'list', kicker: 'Güvenlik', title: 'Dosya çalınsa bile <em>okunamaz</em>', items: [['🔒', 'Kasa: Argon2id + AES-256-GCM, ana parola cihazdan çıkmaz'], ['⛓', 'Pano ve geçmiş diskte şifreli, anahtar işletim sistemi kasasında'], ['◼', 'Ekran görüntüsü / kayıt koruması, kopyalama engeli'], ['⏱', 'Otomatik kilit, 30 sn pano temizleme, kaba kuvvet koruması']] },
        { type: 'shot', kicker: 'AI Stüdyo', title: 'Biten iş, <em>hazır metin</em>', lead: 'Yönetici e-postası, STAR yöntemiyle CV maddeleri, değişiklik talebi ve olay raporu. Hassas veriler önce cihazda maskelenir.', img: 'ai' },
        { type: 'cta', kicker: 'Hemen dene', title: 'Tamamen <em>ücretsiz</em>', lead: 'Reklam yok, abonelik yok, veri toplama yok. MIT lisanslı açık kaynak.', url: 'github.com/dagcann34/kanvault', note: 'Windows (.exe / .msi) · macOS (.dmg) · Türkçe / English' },
      ],
    },
    en: {
      credit: 'Developed by Dağcan Nural',
      swipe: 'Swipe →',
      slides: [
        { type: 'cover', kicker: 'Free · Open source', title: 'Kan<em>vault</em>', lead: 'A task board, encrypted vault, time machine and dashboard studio for IT teams — in one desktop app.', pills: ['Free & open source', 'Windows', 'macOS', 'EN / TR'] },
        { type: 'list', kicker: 'The problem', title: 'One sysadmin, <em>five tools</em>', items: [['▦', 'Tasks in one place, server passwords in another'], ['⌁', 'PowerShell scripts scattered across the desktop'], ['✉', 'The weekly status email always left to the last minute'], ['?', 'No answer to “what did we do last month?”']] },
        { type: 'shot', kicker: 'Board', title: 'A <em>neon Kanban</em> that fits', lead: 'No accidental dragging. Priorities, due dates, dependencies, checklists, time tracking, recurring tasks and templates.', img: 'board' },
        { type: 'shot', kicker: 'Time Machine', title: 'Go back to <em>any day</em>', lead: 'Every change is recorded, encrypted. See the board as it was and everything done that day.', img: 'history' },
        { type: 'themes', kicker: 'Dashboard Studio', title: 'Pick a range, <em>pick a theme</em>', lead: 'One-click PNG / PDF reports.', imgs: [['dash-neon', 'Neon HUD'], ['dash-whiteboard', 'Whiteboard'], ['dash-chalkboard', 'Chalkboard'], ['dash-blueprint', 'Blueprint']] },
        { type: 'list', kicker: 'Security', title: 'Even a stolen file <em>stays unreadable</em>', items: [['🔒', 'Vault: Argon2id + AES-256-GCM, master password never leaves the device'], ['⛓', 'Board & history encrypted at rest, key in the OS keychain'], ['◼', 'Screenshot / recording protection, copy blocking'], ['⏱', 'Auto-lock, 30-second clipboard clearing, brute-force back-off']] },
        { type: 'shot', kicker: 'AI Studio', title: 'Finished work, <em>ready to send</em>', lead: 'Executive emails, STAR-method CV bullets, change requests and incident reports. Sensitive data is masked on-device first.', img: 'ai' },
        { type: 'cta', kicker: 'Try it now', title: 'Completely <em>free</em>', lead: 'No ads, no subscriptions, no telemetry. MIT-licensed open source.', url: 'github.com/dagcann34/kanvault', note: 'Windows (.exe / .msi) · macOS (.dmg) · English / Türkçe' },
      ],
    },
  }[lang];

  const total = C.slides.length;
  const topBar = `<div class="top"><img src="../../public/favicon.svg" alt=""><b lang="en">KANVAULT</b><span lang="en">· Task &amp; Security Hub</span></div>`;
  const foot = (i) => `<div class="foot"><span>${C.credit}</span><span class="n">${String(i + 1).padStart(2, '0')} / ${String(total).padStart(2, '0')}</span></div>`;
  document.getElementById('deck').innerHTML = C.slides.map((s, i) => {
    let body = '';
    if (s.type === 'cover') body = `<img class="bigicon" src="../../public/favicon.svg" alt=""><div class="kicker">${s.kicker}</div><h1 lang="en">${s.title}</h1><p class="lead">${s.lead}</p><div class="pills">${s.pills.map((p, j) => `<span class="pill ${j === 0 ? 'volt' : ''}" lang="${j === 0 ? lang : 'en'}">${p}</span>`).join('')}</div><div class="swipe">${C.swipe}</div>`;
    if (s.type === 'list') body = `<div class="kicker">${s.kicker}</div><h2>${s.title}</h2><ul>${s.items.map(([ic, t]) => `<li><i>${ic}</i><span>${t}</span></li>`).join('')}</ul>`;
    if (s.type === 'shot') body = `<div class="kicker">${s.kicker}</div><h2>${s.title}</h2><p class="lead">${s.lead}</p><div class="shot"><img src="${S(s.img)}" alt=""></div>`;
    if (s.type === 'themes') body = `<div class="kicker">${s.kicker}</div><h2>${s.title}</h2><p class="lead">${s.lead}</p><div class="grid4">${s.imgs.map(([n, c]) => `<figure><img src="${S(n)}" alt=""><figcaption lang="${['Neon HUD', 'Blueprint', 'Whiteboard', 'Chalkboard'].includes(c) ? 'en' : lang}">${c}</figcaption></figure>`).join('')}</div>`;
    if (s.type === 'cta') body = `<div class="kicker">${s.kicker}</div><h2>${s.title}</h2><p class="lead">${s.lead}</p><div class="cta"><div class="url">${s.url}</div><p>${s.note}</p></div>`;
    return `<section class="slide">${topBar}${body}${foot(i)}</section>`;
  }).join('');
})();
</script>
</body>
</html>
