<!doctype html>
<!--
  Sosyal medya kart şablonu. Parametreler: ?lang=tr|en&format=x|li|sq&shot=board|overview|ai
  x  = X/Twitter 1600x900 (16:9)  ·  li = LinkedIn 1200x627  ·  sq = LinkedIn/Instagram 1080x1080
  Render: marketing/render.sh
-->
<html>
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../../node_modules/@fontsource-variable/inter/index.css" />
<link rel="stylesheet" href="../../node_modules/@fontsource/rajdhani/700.css" />
<link rel="stylesheet" href="../../node_modules/@fontsource-variable/jetbrains-mono/index.css" />
<style>
  :root {
    --bg: #06070E; --navy: #0F1226; --brand: #E0218A; --cyan: #00F0FF; --magenta: #FF2E88; --volt: #FCEE0A; --ink: #E8F7FF; --muted: #93A6CC;
    --green: #3CFFA0; --line: rgb(0 240 255 / .18);
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: var(--w); height: var(--h); overflow: hidden; }
  body {
    font-family: "Inter Variable", system-ui, sans-serif; color: var(--ink); -webkit-font-smoothing: antialiased;
    background:
      radial-gradient(900px 600px at 0% 0%, rgb(224 33 138 / .30), transparent 60%),
      radial-gradient(800px 600px at 100% 100%, rgb(0 240 255 / .20), transparent 60%),
      var(--bg);
    position: relative;
  }
  .grid-bg { position: absolute; inset: 0; background: linear-gradient(rgb(0 240 255 / .05) 1px, transparent 1px) 0 0 / 40px 40px, linear-gradient(90deg, rgb(0 240 255 / .05) 1px, transparent 1px) 0 0 / 40px 40px; }
  .grid-bg::after { content: ''; position: absolute; inset: 0; background: repeating-linear-gradient(180deg, rgb(255 255 255 / .025) 0 1px, transparent 1px 3px); }
  .wrap { position: relative; height: 100%; display: grid; }
  .brand { display: flex; align-items: center; gap: 14px; }
  .brand img { width: 56px; height: 56px; filter: drop-shadow(0 0 12px rgb(0 240 255 / .6)); }
  .brand b { font-family: Rajdhani, sans-serif; font-size: 28px; letter-spacing: .06em; text-transform: uppercase; }
  .brand span { display: block; font-family: 'JetBrains Mono Variable', monospace; font-size: 13px; color: var(--magenta); letter-spacing: .08em; text-transform: uppercase; }
  h1 { font-family: Rajdhani, sans-serif; font-weight: 700; letter-spacing: .02em; line-height: .98; text-transform: uppercase; }
  h1 em { font-style: normal; color: var(--cyan); text-shadow: 0 0 24px rgb(0 240 255 / .55); }
  .sub { color: var(--muted); line-height: 1.4; }
  ul { list-style: none; padding: 0; display: grid; }
  li { display: flex; gap: 12px; align-items: flex-start; line-height: 1.3; }
  li i { flex: none; width: 26px; height: 26px; border-radius: 8px; display: grid; place-items: center; font-style: normal; font-size: 14px;
         background: rgb(0 240 255 / .10); border: 1px solid rgb(0 240 255 / .45); color: var(--cyan); }
  .pills { display: flex; flex-wrap: wrap; gap: 10px; }
  .pill { border: 1px solid var(--line); background: rgb(0 240 255 / .05); padding: 8px 16px; font-size: 16px; font-weight: 700; font-family: Rajdhani, sans-serif; letter-spacing: .08em; text-transform: uppercase; clip-path: polygon(6px 0,100% 0,100% calc(100% - 6px),calc(100% - 6px) 100%,0 100%,0 6px); }
  .pill.free { background: var(--volt); border-color: var(--volt); color: #06070E; }
  .credit { font-size: 15px; color: var(--muted); margin-top: -12px; }
  .url { font-size: 16px; color: var(--muted); font-family: 'JetBrains Mono Variable', monospace; }
  .shot { overflow: hidden; border: 1px solid rgb(0 240 255 / .5);
          box-shadow: 0 40px 120px rgb(0 0 0 / .7), 0 0 40px rgb(0 240 255 / .25), 0 0 0 8px rgb(255 46 136 / .12); background: var(--bg); }
  .shot img { display: block; width: 100%; }

  /* X 1600x900 & LinkedIn 1200x627: metin solda, ekran görüntüsü sağda taşarak */
  .wide .wrap { grid-template-columns: 46% 54%; }
  .wide .left { display: flex; flex-direction: column; justify-content: center; gap: 26px; padding: 0 0 0 var(--pad); }
  .wide .right { position: relative; }
  .wide .shot { position: absolute; top: 50%; left: 40px; width: 150%; transform: translateY(-50%) perspective(2000px) rotateY(-9deg) rotateX(3deg); transform-origin: left center; }

  .x { --w: 1600px; --h: 900px; --pad: 90px; }
  .x h1 { font-size: 68px; } .x .sub { font-size: 24px; } .x ul { gap: 14px; } .x li { font-size: 21px; }

  .li { --w: 1200px; --h: 627px; --pad: 64px; }
  .li .left { gap: 18px !important; }
  .li h1 { font-size: 50px; } .li .sub { font-size: 19px; } .li ul { gap: 10px; } .li li { font-size: 17px; }
  .li .brand img { width: 44px; height: 44px; } .li .brand b { font-size: 21px; } .li .pill { font-size: 14px; padding: 6px 13px; }
  .li .url { font-size: 15px; }

  /* Kare 1080x1080: üstte metin, altta ekran görüntüsü */
  .sq { --w: 1080px; --h: 1080px; }
  .sq .wrap { grid-template-rows: auto 1fr; padding: 72px 72px 0; gap: 36px; }
  .sq .left { display: flex; flex-direction: column; gap: 22px; }
  .sq h1 { font-size: 64px; } .sq .sub { font-size: 22px; }
  .sq ul { grid-template-columns: 1fr 1fr; gap: 14px 24px; } .sq li { font-size: 19px; }
  .sq .right { position: relative; }
  .sq .shot { position: absolute; left: 0; width: 140%; top: 0; }
</style>
</head>
<body>
<div class="grid-bg"></div>
<div class="wrap">
  <div class="left">
    <div class="brand"><img src="../../public/favicon.svg" alt="" /><div><b lang="en">Kanvault</b><span id="tagline" lang="en"></span></div></div>
    <h1 id="title"></h1>
    <p class="sub" id="sub"></p>
    <ul id="features"></ul>
    <div class="pills" id="pills"></div>
    <div class="url">github.com/dagcann34/kanvault</div>
    <div class="credit" id="credit"></div>
  </div>
  <div class="right"><div class="shot"><img id="shot" alt="" /></div></div>
</div>
<script>
  const q = new URLSearchParams(location.search);
  const lang = q.get('lang') === 'en' ? 'en' : 'tr';
  const format = q.get('format') || 'x';
  const shot = q.get('shot') || 'board';
  document.body.className = (format === 'sq' ? '' : 'wide ') + format;
  document.documentElement.lang = lang;

  const copy = {
    tr: {
      tagline: 'Task & Security Hub',
      title: 'İşlerin, şifrelerin ve raporların <em>tek uygulamada.</em>',
      credit: 'Dağcan Nural tarafından geliştirilmiştir',
      sub: 'BT altyapı ekipleri için Kanban pano, sıfır bilgi şifreli kasa ve AI raporlama.',
      features: [
        ['▦', 'Sabit Kanban pano, şablonlar, PNG / PDF rapor'],
        ['🔒', 'Argon2id + AES-256-GCM şifreli kasa, otomatik kilit'],
        ['✦', 'AI ile yönetici e-postası, CV (STAR), RFC ve olay raporu'],
        ['⏱', 'Zaman Makinesi ve Beyaz Tahta / Kara Tahta dashboardları'],
      ],
      pills: ['Ücretsiz & açık kaynak', 'Windows', 'macOS', 'TR / EN'],
    },
    en: {
      tagline: 'Task & Security Hub',
      title: 'Your tasks, secrets and reports <em>in one app.</em>',
      credit: 'Developed by Dağcan Nural',
      sub: 'Kanban board, zero-knowledge vault and AI reporting for IT infrastructure teams.',
      features: [
        ['▦', 'Fixed Kanban board, templates, PNG / PDF reports'],
        ['🔒', 'Argon2id + AES-256-GCM encrypted vault with auto-lock'],
        ['✦', 'AI executive emails, STAR CV bullets, RFCs and postmortems'],
        ['⏱', 'Time Machine + Whiteboard / Chalkboard dashboards'],
      ],
      pills: ['Free & open source', 'Windows', 'macOS', 'EN / TR'],
    },
  }[lang];

  document.getElementById('tagline').textContent = copy.tagline;
  document.getElementById('credit').textContent = copy.credit;
  document.getElementById('title').innerHTML = copy.title;
  document.getElementById('sub').textContent = copy.sub;
  document.getElementById('features').innerHTML = copy.features.map(([i, t]) => `<li><i>${i}</i><span>${t}</span></li>`).join('');
  document.getElementById('pills').innerHTML = copy.pills.map((p, i) => `<span class="pill ${i === 0 ? 'free' : ''}" lang="${i === 0 ? lang : 'en'}">${p}</span>`).join('');
  document.getElementById('shot').src = `../../docs/screenshots/${shot}-${lang}.png`;
</script>
</body>
</html>
