# Her push/PR'da: tip kontrolü + derleme, Rust testleri, bağımlılık güvenlik denetimi ve
# güvenlik yapılandırması kontrolü. Tüm action'lar commit SHA'sına sabitlenmiştir.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - name: Security configuration guard
        run: |
          test -f src-tauri/capabilities/main.json
          test -f src-tauri/capabilities/quick.json
          ! test -f src-tauri/capabilities/default.json
          grep -q '"freezePrototype": true' src-tauri/tauri.conf.json
          grep -q '"contentProtected": true' src-tauri/tauri.conf.json
          ! grep -q 'devtools' src-tauri/Cargo.toml
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run build
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: cargo audit
        run: |
          cargo install cargo-audit --locked
          cargo audit --file src-tauri/Cargo.lock
