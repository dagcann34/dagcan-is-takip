# Bir "v*" etiketi gönderildiğinde macOS (Apple Silicon + Intel) ve Windows kurulum dosyalarını
# derleyip taslak GitHub Release'e ekler ve derleme kaynağı kanıtı (build provenance) üretir.
# Güvenlik: action'lar SHA'ya sabitli, önbellek kullanılmaz (önbellek zehirlenmesine karşı).
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions: {}

jobs:
  build:
    # Yazma ve OIDC yetkileri yalnızca bu job'a verilir.
    permissions:
      contents: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
          - platform: macos-latest
            args: --target x86_64-apple-darwin
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Security configuration guard
        shell: bash
        run: |
          test -f src-tauri/capabilities/main.json
          ! test -f src-tauri/capabilities/default.json
          grep -q '"contentProtected": true' src-tauri/tauri.conf.json

      - run: npm ci --ignore-scripts
      - run: npm audit --omit=dev --audit-level=high
      - run: cargo test --manifest-path src-tauri/Cargo.toml

      - id: tauri
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Kanvault ${{ github.ref_name }}
          releaseBody: See CHANGELOG.md / Ayrıntılar CHANGELOG.md dosyasında.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      - name: Build provenance (macOS)
        if: runner.os == 'macOS'
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: src-tauri/target/*/release/bundle/dmg/*.dmg

      - name: Build provenance (Windows)
        if: runner.os == 'Windows'
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
