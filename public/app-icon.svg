<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Kanvault">
  <defs>
    <linearGradient id="kv-neon" gradientUnits="userSpaceOnUse" x1="140" y1="110" x2="400" y2="410">
      <stop offset="0" stop-color="#00F0FF"/>
      <stop offset="1" stop-color="#FF2E88"/>
    </linearGradient>
    <linearGradient id="kv-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0F1226"/>
      <stop offset="1" stop-color="#06070E"/>
    </linearGradient>
    <filter id="kv-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Kesik köşeli kasa kapağı -->
