[package]
name = "dagcan-is-takip"
version = "0.2.0"
description = "Dağcan İş Takip — Enterprise Task & Security Hub"
edition = "2021"

[lib]
name = "dagcan_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-notification = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

# Kriptografi (RustCrypto)
argon2 = "0.5"
aes-gcm = "0.10"
rand = "0.8"
zeroize = { version = "1", features = ["derive"] }
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }

# Claude API istemcisi (anahtar asla WebView'e çıkmaz)
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

# Disk dostu geliştirme derlemesi: debug sembolleri kapalı, bağımlılıklar optimize.
[profile.dev]
debug = 0
incremental = false

[profile.dev.package."*"]
opt-level = 1
